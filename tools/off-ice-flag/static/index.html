<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off-ice Flag</title>
<!-- Served under Ingress /app: relative URLs only work from /app/, so add the slash. -->
<script>if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search);</script>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>Off-ice Flag</h1>
  </div>
  <div class="status">
    <span id="fixture" class="badge" hidden title="Fixture cards, not the judged clip">Sample data</span>
    <span id="status" class="pill" role="status">Loading tape…</span>
  </div>
</header>

<main class="grid">
  <section class="stage" aria-label="Replay">
    <div class="screen">
      <video id="video" muted playsinline preload="auto"></video>
      <div id="noVideo" class="novideo" hidden>
        <p>No video for this card</p>
        <div class="sim"><span id="simBar"></span></div>
      </div>
      <span id="chip" class="chip" hidden></span>
      <div id="stop" class="stop" hidden>
        <p class="stop-word">Come off</p>
        <p id="stopSigns" class="stop-signs"></p>
        <button id="resume" class="btn primary" type="button">Resume tape</button>
      </div>
      <div id="empty" class="empty"><p id="emptyText">Loading…</p></div>
    </div>
    <div class="transport">
      <button id="prev" class="btn icon" type="button" aria-label="Previous card">&#8249;</button>
      <button id="play" class="btn primary" type="button">Play tape</button>
      <button id="next" class="btn icon" type="button" aria-label="Next card">&#8250;</button>
      <span id="pos" class="pos"></span>
    </div>
    <div class="track">
      <div id="timeline" class="timeline" aria-label="Cards on the game clock"></div>
      <div class="axis"><span>0:00</span><span id="durLabel"></span></div>
    </div>
  </section>

  <aside class="panel card" id="card" aria-live="polite">
    <p class="hint">Press <b>Play tape</b>, or pick a card.</p>
  </aside>

  <section class="panel list" aria-label="Tape">
    <div class="list-head">
      <h2>Tape</h2>
      <label class="sort">Sort
        <select id="sort">
          <option value="time">Game clock</option>
          <option value="signs">Most visible signs</option>
        </select>
      </label>
    </div>
    <div class="filters" role="group" aria-label="Filter by decision">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="come_off" aria-pressed="false">Come off</button>
      <button type="button" data-f="watch" aria-pressed="false">Watch</button>
      <button type="button" data-f="play_on" aria-pressed="false">Play on</button>
    </div>
    <ol id="items" class="items"></ol>
  </section>

  <section class="panel ask" aria-label="Questions">
    <h2>Ask about this game</h2>
    <form id="askForm" class="askform">
      <input id="q" type="text" placeholder="Who should have come off?" autocomplete="off" aria-label="Question">
      <button id="askBtn" class="btn primary" type="submit">Ask</button>
    </form>
    <div id="answer" class="answer" hidden></div>
    <h3>Saved questions</h3>
    <ul id="saved" class="saved"></ul>
  </section>
</main>

<footer class="foot">Flags come from what the camera shows. A trainer makes the call.</footer>
</body>
</html>
